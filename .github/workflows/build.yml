name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app name
        run: echo "APP=$(grep -oP 'rootProject.name = "\K[^"]+' settings.gradle.kts)" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $BT/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APP.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-APK
          path: app/build/outputs/apk/debug/${{ env.APP }}.apk

      # GitHub Release marked "latest", so this fixed link always downloads the newest APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/<AppName>.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create "v$VER-build${{ github.run_number }}" \
            "app/build/outputs/apk/debug/$APP.apk" \
            --title "$APP $VER (build ${{ github.run_number }})" \
            --notes "Tap $APP.apk below to download and install." \
            --latest
